- id: D-013
  title: Model asset alignment — name it *.gguf.so
  raised_at: 2026-09-15
  sla_expires_at: 2026-09-17
  spine: [C1, C2]
  platform: android
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [Engineering, Architecture]
  depends_on: [W18]
  context: >
    Measured (tools/zip_entry_offset.py): a file mmap keeps each byte at its file offset mod page size,
    so tensor pointers inherit the asset's offset; ggml's CPU backend needs a multiple of 32.
    - bundletool 1.18.3, asset named .gguf    → stored, offset 696 (mod 32 = 24): NOT mmappable
    - bundletool 1.18.3, asset named .gguf.so → stored, offset 16384: OK (split); universal APK offset 49152: OK
    - AGP 9.4 APK packager, .gguf.so          → offset mod 32 = 8: NOT mmappable (zipalign 16384 fixes)
    bundletool's ModuleSplitSerializer.alignmentForEntry page-aligns any path ending ".so" (Architecture B4:
    verified in bytecode, unconditional, independent of useLegacyPackaging).
    Host test loads the model straight out of the bundletool split APK and generates text.
  evidence: >
    Emulator confirmation (leaves/NOTES.md "Emulator functional run", 2026-09-15): release AAB installed via
    bundletool build-apks --connected-device --local-testing; model entry asset-slices/modelpack-master.apk
    STORED at offset 16384 (mod 16384 = 0); the app loads it from split_modelpack.apk and streams replies.
    This confirms the device path with local bundletool — NOT Play's server-side bundletool (W18).
  risk: >
    Relies on a bundletool implementation detail that Play runs server-side. Unknown [B]: whether Play's
    16 KB / native-code scanners flag a non-ELF .so in assets. Mitigations: runtime check rejects misaligned
    offsets with a clear error; W18 downloads Play's generated APKs (splits AND the signed universal APK, see
    D-018) and runs tools/zip_entry_offset.py before every release.
  options: [".gguf.so naming (current)", "relax ggml host-pointer assert to 4 bytes on aarch64 (patch)", "copy model to internal storage (breaks storage budget)"]
  recommendation: keep .gguf.so; W18 is mandatory, not optional.
  implemented_provisionally: yes
  if_rejected: carry the ggml patch or accept a second 400 MB copy on disk.
  cross_platform: >
    Android only, and it disappears on iOS: an app bundle is a directory, so there is no zip offset to
    align (architecture B4, play-policy-checklist.md §16.2). What survives the crossing is the
    fd + offset + length signature itself — iOS passes offset 0 and the full file length (§1.5).

