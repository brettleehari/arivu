- id: D-001
  title: Package name (applicationId)
  raised_at: 2026-09-15
  sla_expires_at: 2026-09-17
  spine: [C1]
  platform: both
  adjudication: human
  status: resolved_human
  decided_at: 2026-09-15
  decided_by: Hari
  resolution: >
    Package name is io.github.brettleehari.arivu. No domain is owned; the GitHub namespace
    brettleehari is the namespace Hari controls, which is the standard convention for
    open-source Android apps without a domain. arivu.org, .app, .dev, .io, .in, .me, .net and
    .xyz were all checked and are registered to others. arivu.fyi ($5.66/yr flat) and
    arivu.page ($10.81/yr flat) were available and declined in favour of the free namespace.
    Applied in android/gradle.properties and across the source tree; emulator-verified that
    JNI symbols still bind after the rename.
  blocks_release: true
  blocks_release_scope: both
  deadline: before the first Play upload
  raised_by: [Engineering]
  blocks: [W16, W17, W19]
  context: >
    Irreversible once uploaded to Play, and iteration-2's shareable APK must carry the same one.
    Reverse-DNS convention expects a domain you control. arivu.org is registered (since 2012-09-22,
    registrar PDR Ltd.) — ownership not verified from here. Developer verification registers this package
    name to Hari's account; register it early against renamed clones (threat-model.md T1, T2). If Hari
    controls arivu.org it can also host the privacy policy (D-022).
  options:
    - "io.github.brettleehari.arivu: only if you control arivu.org"
    - "com.arivu.app: conventional, but implies arivu.com ownership, which is also unverified"
    - "a domain you already own, e.g. <yourdomain>.arivu"
  recommendation: io.github.brettleehari.arivu if Hari confirms control of arivu.org; otherwise a reverse domain he owns.
  implemented_provisionally: "io.github.brettleehari.arivu (android/gradle.properties arivu.applicationId)"
  if_rejected: change one property before the first Play upload; nothing else depends on it.
  cross_platform: >
    Spine 0.2: the same string is now also the iOS bundle id — ios/project.yml sets
    PRODUCT_BUNDLE_IDENTIFIER io.github.brettleehari.arivu and bundleIdPrefix io.github.brettleehari
    [V-local]. Architecture §7 "App identity across channels": one package on Play, one bundle id and
    one team id on the App Store. Resolved for both; no further action.

- id: D-002
  title: "\"Permissions: None\" vs the permissions the settled design needs (leaves/BRIEF.md correction)"
  raised_at: 2026-09-15
  sla_expires_at: 2026-09-17
  spine: [C3, C10, C6]
  platform: android
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [Engineering, Compliance]
  context: >
    A foreground service needs android.permission.FOREGROUND_SERVICE; ACTION_DELETE for our own
    package needs REQUEST_DELETE_PACKAGES when targetSdk >= 28 (see D-006). Both are "normal"
    permissions: granted at install, no prompt, no network. AndroidX also adds a signature permission,
    io.github.brettleehari.arivu.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION (leaves/NOTES.md host verification; check_manifest.sh
    allows exactly these three). POST_NOTIFICATIONS is deliberately NOT requested. Compliance confirms
    REQUEST_DELETE_PACKAGES is not on Play's sensitive-permission declaration list
    (play-policy-checklist.md §5, [V]). The core claim (no INTERNET) is intact.
  related_brief_correction: >
    Compliance (play-policy-checklist.md §9): leaves/BRIEF.md "Distribution" says developer verification
    enforcement "began 2026-09-30". It BEGINS 2026-09-30 (15 days from today) in Brazil, Indonesia,
    Singapore, Thailand; global in 2027 [V: developer.android.com/developer-verification]. The action it
    requires is tracked in D-020. Both corrections go to Hari as one leaves/BRIEF.md edit.
  options:
    - amend leaves/BRIEF.md to the enforced allow-list (below)
    - keep "None" literally (drop the foreground service and ACTION_DELETE)
  recommendation: >
    Amend leaves/BRIEF.md to "No network permissions and no runtime-prompted permissions. Allowed:
    FOREGROUND_SERVICE, REQUEST_DELETE_PACKAGES, and the AndroidX-generated
    DYNAMIC_RECEIVER_NOT_EXPORTED signature permission." tools/check_manifest.sh enforces exactly that list.
    In the same edit, change "enforcement began 2026-09-30" to "enforcement begins 2026-09-30".
  implemented_provisionally: yes (manifest, check_manifest.sh; in-app privacy text privacy_internet_body describes all three)
  if_rejected: drop the foreground service (C10 weakens) and use the app-settings page instead of ACTION_DELETE; rewrite privacy_internet_body.

- id: D-003
  title: "\"Free context immediately in onStop\" vs \"foreground service until the last token\""
  raised_at: 2026-09-15
  sla_expires_at: 2026-09-17
  spine: [C2, C10]
  platform: android
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [Engineering]
  context: >
    Taken literally, onStop kills a reply the service exists to protect.
  evidence: >
    Emulator (functional only, leaves/NOTES.md "Emulator functional run"): app backgrounded 2.5 s into a
    208-token reply → GenerationService isForeground=true, type shortService; reply completed hidden;
    "context freed: generation finished while hidden". Architecture B5 found onTimeout(int) (API 34) missing;
    Engineering now overrides both (engineering.md map) — API 34 timeout still NOT verified.
  options:
    - onStop frees the context unless a reply is being written (recommended)
    - onStop always frees the context (a hidden reply dies)
  recommendation: >
    onStop frees the context unless a reply is being written; the service keeps the process alive;
    when the reply finishes while hidden, the context is freed at once. Service type shortService
    (~3 min limit, no extra permission). On timeout: cancel if hidden, continue if visible.
  implemented_provisionally: "InferenceController.onUiHidden / GenerationService"
  if_rejected: remove the generating exemption in onUiHidden; C10's "survives a brief app switch" no longer holds.

- id: D-004
  title: 1.7B fallback and the Play asset-pack size limit (premise corrected)
  raised_at: 2026-09-15
  sla_expires_at: 2026-09-17
  spine: [C1, C2]
  platform: android
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [Engineering, Compliance]
  depends_on: [W02, W03, W04]
  context: >
    Measured file sizes: Qwen3-0.6B Q4_K_M 396,705,472 B; Qwen3-1.7B Q4_K_M 1,107,409,472 B.
    ORIGINAL PREMISE (from leaves/BRIEF.md "combined install-time limit is 1GB") WAS WRONG.
    Correction (Compliance, play-policy-checklist.md §12, [V] support.google.com answer/9859372, checked
    2026-09-15): base module 500 MB; individual asset pack 1.5 GB; cumulative total for all modules and
    install-time packs 4 GB. The 1.7B Q4_K_M file fits in one install-time pack. Remaining costs of 1.7B are
    not size limits: ~1.1 GB download for users who ration data (C1), install-time packs need ~2× their size
    free at install [V], weights mmap ~2.8× larger against the 800 MB peak RSS target (M3), and tok/s (M2).
  options:
    - drop the fallback; 0.6B only
    - 1.7B Q4_K_M in the install-time pack (now allowed by size) — only if W02 shows >= 8 tok/s and M3 holds
    - 1.7B at Q3_K_M (~0.9 GB) — quality and speed must be re-benchmarked
    - fast-follow pack — breaks C1 ("no model download") in spirit
  recommendation: >
    Decide at W03 from W02 (tok/s, peak RSS) and W04 (D-017 quality). The size limit no longer rules 1.7B out;
    speed, memory and download size still might. Correct leaves/BRIEF.md "Build artifact" (1 GB → 1.5 GB per pack,
    4 GB cumulative).
  implemented_provisionally: "no (0.6B only is what ships)"
  if_rejected: n/a until W03.

- id: D-005
  title: The two ModelSource implementations converge
  raised_at: 2026-09-15
  sla_expires_at: 2026-09-17
  spine: [C1]
  platform: android
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [Engineering, Architecture]
  depends_on: [W18]
  context: >
    Install-time pack assets and base-APK assets are both read via AssetManager.openFd() from inside
    an APK. The interface is kept (PadInstallTimeModelSource wired, EmbeddedApkModelSource stubbed),
    but they will differ only in naming and verification, not mechanism. Also: llama.cpp cannot load
    from fd+offset; tools/llama/patches/0001 adds llama_model_load_from_fd (verified on host).
    Architecture adds (architecture.md, iteration-2 note): Play's universal APK merges install-time pack
    assets into assets/, so the PAD source likely works unchanged [B, verify in W18]; a Play-installed copy
    is split APKs and cannot seed P2P shares (R1 consequence).
  options:
    - keep the interface as leaves/BRIEF.md asks (recommended)
    - collapse to one implementation now
  recommendation: keep the interface as leaves/BRIEF.md asks; note the convergence; upstream the patch.
  implemented_provisionally: yes
  if_rejected: merge the two classes; no user-visible change.
  cross_platform: >
    Android-only as a question (install-time pack vs base-APK assets). iOS adds a third ModelSource
    reading a plain file from the app bundle, and architecture.md §1.5 / B8 requires it to call
    arivu_load_model_fd(fd, 0, length) so one loading path ships on both platforms — offset 0, full
    length. That keeps the fd + offset + length signature MULTIPLATFORM.md asks for.

