    Play ships in waves by country (D-029) because the UI is English-only, the eval has not covered
    Portuguese or Indonesian, and developer verification gates four countries. GTM's position is that
    none of that reasoning transfers to iOS: its audience is recommenders, press and diaspora, who live
    outside the Play waves, so all 175 storefronts from day one. Availability is not capability, so two
    different answers here are not a C11 divergence — and it is narrowable later without a new version.
    The premise is D-040's answer about what iOS is for.
  options:
    - "All 175 storefronts from day one (recommended)"
    - "Mirror the Play waves"
  recommendation: >
    GTM's, contingent on D-040. If iOS turns out to be for being used rather than for being recommended,
