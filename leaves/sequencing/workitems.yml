# Sequencing Leaf — Arivu work items
# spine_version: 0.2
# last_sequenced: 2026-09-16 (monorepo round: /core + /android + /ios; decisions.yml D-001..D-059)
#
# WHAT CHANGED IN 0.2
#   - iOS is in scope (SPINE 0.2 withdrew R7, added C11). Every item now carries `platform:`.
#   - There are FOUR milestones, two per store, and the two stores are INDEPENDENT calendars.
#     Compliance verified Apple imposes no 12-tester / 14-day gate, so the iOS queue is no longer
#     downstream of the Play closed test. See `milestones:` below.
#   - `uses:` now names physical resources (phone, iphone, mac-with-xcode). Every resource must be
#     declared in `resources:` as available or not, so "we have no iPhone" is a scheduling fact and
#     not a surprise. An unavailable resource with an `acquired_by:` item becomes an implicit
#     dependency; without one, every item that uses it is unschedulable.
#
# status: done | in_progress | todo | blocked
# done means verified to the level stated in `verified`, never more. The first word of `verified`
# must be one of these levels, cheapest first:
#   type-checked-only  the code compiles (or the file was authored) and has never run
#   delivered          a document/asset exists; no executable claim
#   resolved_human     Hari answered; recorded in decisions.yml
#   core               core/tests — no model, no platform SDK
#   host               macOS arm64 host build sharing core/src/engine.cpp
#   unit               JVM tests (Android) — 56 of them
#   swift-macos        ios/ArivuKit compiled and tested on macOS — 98 tests, no iOS SDK involved
#   build              Gradle/scripts asserting something about the artifact
#   emulator           arm64 AVD, FUNCTIONAL ONLY, never performance
#   simulator          iOS Simulator, FUNCTIONAL ONLY, never performance
#   phone              the 4 GB Android test phone        — nothing has reached this level
#   iphone             the 3-4 GB test iPhone             — nothing has reached this level
#   play / appstore    the store accepted or reviewed it  — nothing has reached this level
# Only `phone` counts for M1-M4 on Android; only `iphone` counts for their iOS twins.
#
# Fields
#   owner          Leaf name (Engineering, Design, GTM, Compliance, Architecture, Decisions) or "Hari"
#   platform       android | ios | both — which store's queue this item sits in. `both` means the
#                  work or the decision serves both; it does NOT mean the item is done twice.
#   spine          Spine commitment / metric IDs (C1..C11, M1..M6, R1..R8)
#   estimate_days  working days of the owner's effort (people-time)
#   elapsed_days   calendar days that pass after the effort and consume nobody (reviews, the 14-day
#                  closed test, a phone in the post)
#   guess: true    the estimate (or elapsed time) is a guess, not grounded in a measurement or SLA
#   deadline       ISO date; flagged overdue / at risk against today by tools/sequence.py
#   deadline_note  a relative deadline ("before the first upload")
#   uses           exclusive resources besides the owner; must be declared in `resources:` below
#   deps           hard dependencies (scheduled, on the critical path)
#   soft_deps      should come first but do not block (dotted in the graph, not scheduled against)
#   skip_if        scenario tags under which the item is not required (used for what-if calendars)
#   decisions      IDs in leaves/decisions.yml (D-001..D-059 as renumbered on 2026-09-16)
#
# Rendered by tools/sequence.py -> leaves/sequencing/SEQUENCING.md
#
# ======================================================================================================
# ID MAP — six Leaves proposed work items this round and all of them numbered from W67 independently.
# The collisions are resolved here, once, the way decisions.yml resolved D-038+.
# ======================================================================================================
# Architecture (§11)   W67 boundary lint      -> W67      W76 arivu_backend_init -> W72
#                      W68 C-API conformance  -> W68      W77 Android DeviceProbe-> W79
#                      W69 profile budget CI  -> W69      W78 iOS DeviceProbe    -> W80
#                      W70 core version       -> W70      W79 three CI workflows -> W74 (+ W75)
#                      W71 one-sentence check -> W71      W80 tiny GGUF fixture  -> W73
#                      W72 release-and-signing iOS -> W76 W81 iPhone memory      -> W93 (merged)
#                      W73 check_ios_binary.sh-> W78      W82 mapped vs footprint-> W82 (DONE)
#                      W74 iOS at-rest test   -> W98      W83 gate says why      -> W81
#                      W75 TestFlight thinning-> W120 (folded into the milestone)
# Design (§13)         W67 iOS string catalog -> W104 (DONE) W71 iPhone a11y pass -> W99
#                      W68 check_copy.py      -> W77         W72 iOS contrast     -> W100
#                      W69 low-memory copy    -> W83         W73 iOS screenshots  -> W101 (merged)
#                      W70 clipboard <=12     -> W84         W74 App Store icon   -> W95
# iOS Eng (§"proposed")W75 first Xcode build  -> W90      W78 CoreParity on core -> W97
#                      W76 build_core.sh      -> W88      W79 iOS device walk    -> W94
#                      W77 iPhone measurement -> W93      W80 check_copy iOS side-> W77 (merged)
# GTM (positioning §9) W-GTM-i1 check_ios_binary -> W78 (merged)   W-GTM-i4 iOS shots -> W101 (merged)
#                      W-GTM-i2 iPhone numbers  -> W93 (merged)    W-GTM-i5 4-way read-> W107
#                      W-GTM-i3 conversation at rest -> W98 (merged) W-GTM-i6 support page -> W106
# Compliance (§16.3)   PrivacyInfo.xcprivacy -> W102 (DONE)  MinimumOSVersion -> W109
#                      ITSAppUsesNonExempt   -> W102 (DONE)  App Review notes -> W105
#                      iOS licences + About  -> W103         Apple enrolment  -> W110
#                      ios_release_check on a real archive -> W96   make_notice.py -> W117
#
# W125-W136 are new IDs for work that LANDED this round and had no item at all (the monorepo move,
# the core profile/prompt work, Android round 3, the whole iOS port, the CI workflows, the
# ios_release_check gate, and each Leaf's 0.2 rewrite). They are numbered above the open work because
# an ID is a label, not a position: renumbering the open items would break every citation in the
# other Leaves.
#
# ======================================================================================================

slices:
  BENCH: leaves/BRIEF.md build order step 1 — on-device measurements; nothing after W08/W93 is trusted until it holds on a real handset
  MVP:   steps 2–8, verified on the physical device (either platform)
  PLAY:  step 9 on Android — Play submission and release
  STORE: the App Store twin of PLAY — enrolment, TestFlight, submission, release
  CORE:  shared /core and /tools work that serves both shells

# ------------------------------------------------------------------------------------------------
# Physical and account resources. Every `uses:` value must appear here with an explicit `available`.
# available: false + acquired_by: <item> => that item becomes an implicit dependency of every user.
# available: false and no acquired_by  => every item that uses it is UNSCHEDULABLE, and says so.
# ------------------------------------------------------------------------------------------------
resources:
  phone:
    title: The 4 GB Android test phone (Helio G85 / SD680 class) on adb
    available: false
    capacity: 1
    acquired_by: W112
    note: >
      W41 has assumed since 0.1 that Hari already owns this handset. No measurement, screenshot or
      logcat in the repo comes from a physical Android phone, so Sequencing now models it as
      not-yet-in-hand with an explicit purchase item. If Hari does own one, close W112 in a minute
      and every date below moves left.
  iphone:
    title: A 3-4 GB test iPhone (SE 2020 / iPhone 11 class — the iOS twin of the Helio G85 target)
    available: false
    capacity: 1
    acquired_by: W111
    note: >
      STILL DOES NOT EXIST, and the flagship below does not replace it. Arivu's claim is that it
      runs on a modest phone (C2), and every iOS measurement now in the repo comes from an iPhone
      17 Pro Max: 12 GB of RAM, the newest CPU, the most forgiving jetsam budget Apple ships. That
      device cannot fail the memory ceiling, so it cannot test it. Nothing in this repo proves the
      4 GB claim on iOS.
  iphone-dev:
    title: The development iPhone (17 Pro Max) on devicectl
    available: true
    capacity: 1
    note: >
      In hand since 2026-09-20 and used daily since: built, installed, launched and driven on it,
      and 0.1.0 (1) was archived and uploaded from this Mac against it. `verified: iphone` claims
      are therefore real rather than aspirational — but see the entry above for what this device
      cannot tell us.
  mac-with-xcode:
    title: A Mac with Xcode 16+ (Swift 6 toolchain), cmake and xcodegen
    available: true
    capacity: 1
    acquired_by: W85
    note: >
      Xcode has been installed and in daily use since 2026-09-20. Everything under ios/App/**,
      ios/project.yml and tools/ios/*.sh has been compiled, run, tested on the Simulator and
      installed on a handset; the twelve journeys in ios/App/UITests run here, and the App Store
      archive was built and uploaded from this machine.
  mac:
    title: The development Mac as it is today (Command Line Tools, no Xcode)
    available: true
    capacity: 1
  Engineering:
    title: An agent that can drive builds, adb and scripts, lent to another Leaf's item
    available: true
    capacity: 1
  ci-runner:
    title: GitHub-hosted runners (ubuntu-latest and macos-latest)
    available: true
    capacity: 1
    note: >
      Available in principle — the repo is public (D-035) — but no workflow in .github/workflows has
      ever been executed. "Available" here means nothing needs buying, not that it has been proven.

