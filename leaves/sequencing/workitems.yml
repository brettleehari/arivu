# Sequencing Leaf — Arivu work items
# spine_version: 0.1
# last_sequenced: 2026-09-15 (after Engineering round 2 + emulator functional run; decisions.yml D-001..D-034)
#
# status: done | in_progress | todo | blocked
# done means verified to the level stated in `verified`, never more.
#   Levels (engineering.md): host · unit · build · emulator (functional only, never performance) · phone · play.
#   Only "phone" counts for M1–M4. Nothing has run on a physical phone yet.
#
# Fields
#   owner          Leaf name (Engineering, Design, GTM, Compliance, Architecture) or "Hari"
#   estimate_days  working days of the owner's effort (people-time)
#   elapsed_days   calendar days that pass after the effort and consume nobody (reviews, 14-day closed test)
#   guess: true    the estimate (or elapsed time) is a guess, not grounded in a measurement or a documented SLA
#   deadline       ISO date; flagged overdue / at risk against today by tools/sequence.py
#   deadline_note  a relative deadline ("before the first upload")
#   uses           exclusive resources besides the owner: phone (the one 4 GB test phone), Engineering (an agent that can drive adb/build)
#   deps           hard dependencies (scheduled, on the critical path)
#   soft_deps      should come first but do not block (dotted in the graph, not scheduled against)
#   skip_if        scenario tags under which the item is not required (used for what-if calendars)
#   decisions      IDs in leaves/decisions.yml
#
# Rendered by tools/sequence.py → leaves/sequencing/SEQUENCING.md

