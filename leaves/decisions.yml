- id: D-051
  title: Metal stays off on iOS
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C2, C8, C11]
  platform: ios
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [iOS Engineering, Architecture]
  merged_from:
    - "iOS Engineering D-045 (engineering-ios.md)"
    - "Architecture §3.5 (Metal, and why it is not a free win)"
  context: >
    GGML_METAL=OFF and n_gpu_layers = 0 [V-local: tools/ios/build_core.sh, core/src/engine.cpp:26].
    Both Leaves reach the same conclusion by the same route, and it is a memory argument rather than a
    speed one: on iOS's unified memory there is no separate GPU pool, so Metal buffers are DIRTY memory.
    Offloading the weights would convert about 373 MB of uncharged, evictable, clean file-backed pages
    into charged memory — which does not optimise the memory model, it deletes the property the whole
    memory model rests on, the one thing that makes a 400 MB model fit a phone that cannot spare 400 MB.
    Architecture adds two supporting points: MTLDevice.recommendedMaxWorkingSetSize is a performance
    hint, not the kill threshold, so exceeding it and exceeding the footprint limit are two separate
    additive risks [V-doc]; and a Metal-only speed-up fails fork test 1 today, because no Android GPU
    path exists, making it a capability reachable on one platform's hardware only. iOS Engineering adds
    the practical one: one code path means a tok/s figure means the same thing on both platforms.
  options:
    - "Off (recommended), with ARIVU_METAL=1 keeping the experiment one flag away"
    - "On, behind a measurement on a 4 GB iPhone showing phys_footprint still under budget"
  recommendation: >
    Off, and keep the comment in engine.cpp that says why — Architecture asks specifically that the zero
    be documented as load-bearing rather than unfinished. Revisit only if a Vulkan or OpenCL path lands
    on Android, which would change the fork-test answer as well as the memory one.
  implemented_provisionally: "yes (tools/ios/build_core.sh GGML_METAL=OFF; core/src/engine.cpp n_gpu_layers = 0) [V-local]"
  if_rejected: "flip one build flag and one engine line; the iOS memory budget must then be re-derived from W81, and licence-audit.md §7.4 entry 3 must name the Metal backend shaders because default.metallib would ship (gap I3)."

