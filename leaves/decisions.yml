  deadline: before any Play track wider than Internal testing (layer-2 rules do not apply to internal testers)
  raised_by: [Engineering, Architecture, GTM, Compliance]
  depends_on: [W02, W03]
  blocks: [W19]
  context: >
    A "4 GB" phone reports ~3.5–3.8 GiB. Set from W02 peak RSS plus headroom; record in leaves/NOTES.md and
    mirror in the Play Console device-exclusion rule. Architecture B9: rules not applied to internal testers,
