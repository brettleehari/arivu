- id: D-058
  title: Does a device-profile difference ever appear in store copy as a feature?
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C11, C6, C5]
  platform: both
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [GTM]
  merged_from: ["GTM D-GTM-F (positioning.md §9)"]
  related: [D-038]
  context: >
    GTM's answer is no — never "on newer phones you also get...". The only honest listing sentence about
    profile variation is a ceiling rather than a bonus: "How much text Arivu can hold at once depends on
    your phone." This is the marketing-side twin of D-038: the profile mechanism keeps capability off
    the platform axis in code, and this keeps it off the platform axis in the story, which is where
    Architecture's §2.1 failure mode actually gets noticed by users.
  options:
    - "Never as a feature; only as a ceiling, in one sentence (recommended)"
    - "Describe richer profiles as a benefit where they exist"
  recommendation: "As GTM states it. It also keeps the two listings comparable, which is what makes C11 checkable by a reader rather than only by us."
  implemented_provisionally: "yes, by construction — no listing carries a profile-differentiated claim today"
  if_rejected: "the first time an 8 GB phone gets a richer profile, the listing has to explain why some buyers get less, in copy neither store will let us qualify properly."

- id: D-059
  title: iOS storefront availability
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C11, C1]
  platform: ios
  adjudication: human
  status: pending
