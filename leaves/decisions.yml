  options: [accept (M4 means context freed), free the model on idle too (reload is a page-cache hit), find and shrink what holds the 46 MB]
  recommendation: measure on the phone in W08 first; decide only if it matters there.
  implemented_provisionally: "n/a"
  if_rejected: n/a.

