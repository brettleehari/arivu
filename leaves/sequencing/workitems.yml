  - id: W138
    title: "EngineWrapperTests.handleCannotLeak is intermittently red — a global counter read across deferred deallocation"
    slice: MVP
    platform: ios
    spine: [C6]
    owner: Hari
    status: done
    verified: "unit — 8 consecutive runs clean. The cause was not the counter reset (which never touched the engine count) but ArivuEngine being an actor: its deinit is not guaranteed to have run by the closing brace of the scope that held it, so an immediate read saw the old value. The test now waits for the handle to come back rather than requiring it back synchronously"
    was: "seen once in seven full `swift test` runs and never in isolation, so it is a race, not a leak. The test reads arivu_stub_live_engines() as a delta around a `do` scope, but `arivu_stub_reset()` runs in the suite's per-test init while the previous test's ArivuEngine may not have been deallocated yet — its deinit then decrements a counter that has already been zeroed. A test that fails one time in seven is a test people learn to re-run, which is how a real leak gets through it"
    decisions: []
    estimate_days: 0.25
    deps: []
  - id: W139
    title: "Android does not draw the per-reply stats its conversation file now carries"
    slice: MVP
    platform: android
    spine: [C5, C11]
    owner: Hari
    status: todo
    needs: "the `stats` field is in ChatRepository.Message so an Android save cannot silently drop what an iOS save wrote, but nothing on Android writes or shows it. Until it does, the same conversation tells the user what a reply cost on one phone and not on the other — a capability difference with no measurement behind it, which is what C11 forbids. Pairs with the Android learning page (D-061 is iOS-only so far)"
    decisions: [D-061, D-063]
    estimate_days: 0.5
    deps: []
