  raised_by: [Engineering]
  options:
    - non-thinking mode with Qwen's non-thinking sampling (recommended)
    - thinking mode
  recommendation: >
    Non-thinking mode (empty <think></think>) — thinking burns hundreds of tokens per reply at single-digit
