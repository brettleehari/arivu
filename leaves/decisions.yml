- id: D-018
  title: App signing key custody — Google-generated key (A) or Hari's own key via PEPK (B)
  raised_at: 2026-09-15
  sla_expires_at: 2026-09-17
  spine: [C1, C3, R1]
  adjudication: human
  status: pending
  blocks_release: true
  deadline: >
    Provisional choice at the first Internal testing upload (Internal does not lock it); final after the W18
    universal-APK check; hard limit before the first Open testing or Production release — "Signing keys can only
    be changed before the app is released to Open testing or Production tracks" [V-doc].
  raised_by: [Architecture]
  depends_on: [W48]  # provisional A at W52 internal upload; final at W49
  blocks: [W49, W19]
  context: >
    Under Play App Signing there are two keys; only the app signing key decides whether iteration-2's shared APK
    updates a Play install. Google does not let you download a Google-generated key; it offers a signed
    universal APK for distribution elsewhere [V-doc]. A lost upload key can be reset; a lost self-managed app
    signing key cannot. New apps default to hybrid RSA-4096 + ML-DSA-65 Google-generated keys [V-doc].
    Full analysis: leaves/architecture/release-and-signing.md §1–§3; threat-model.md T11, T12.
    Unknowns for A [B]: does Play's universal APK (a) include the install-time model pack, (b) keep the model
    STORED at offset % 32 == 0, (c) exist for hybrid-signed apps.
  options:
    - "A: Google-generated key; the off-Play APK is Play's signed universal APK. Leak risk sits with Google's HSM; off-Play builds only via Console/API."
    - "B: Hari's own RSA-4096 key uploaded via PEPK; Hari signs off-Play APKs himself. A leak lets attackers ship trusted updates (T12, Critical); loss ends off-Play updates forever."
  recommendation: >
    Architecture: A, conditional on W18 showing Play's signed universal APK contains the model stored and
    aligned, and installs over the Play copy and is updated by it. If W18 fails, switch to B before any Open
    testing release.
  implemented_provisionally: "yes (engineering.md release step 6 keeps Play's default; release_check.sh rejects the throwaway test key)"
  if_rejected: generate the app signing key offline, upload via PEPK before Open testing, three encrypted offline copies, rotation plan (release-and-signing.md §3 rule 4).

