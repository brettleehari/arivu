    - add the share-target only, as the cheapest removal of friction
    - add photo OCR in iteration-2, accepting recogniser size and per-script model coverage
  recommendation: >
    Hold until W02 and W04 show Tier 1 is good on the test phone. Then take the share-target
    first. OCR is the highest-value second step and the first one that needs a real Spine
    amendment (R6 refuses images).
  if_rejected: no code changes; the outline stays a GTM document with no promise attached.
  cross_platform: >
    Both platforms. Anything added here must pass BOTH fork tests before it ships: architecture.md §6
    (device-reachable both ways, gracefully absent, same user, no new trust surface) and
    positioning.md §5. A share-target exists on both platforms; OCR needs a Spine amendment (R6) and
    would need it once, for both.

- id: D-037
  title: iOS — amend refusal R7, and if so, when
  raised_at: 2026-09-15
  sla_expires_at: 2026-09-17
  spine: [C1, C2, C3, C11]
  platform: both
  adjudication: human
  status: superseded
  superseded_by: SPINE 0.2 (2026-09-15)
  closed_at: 2026-09-16
  closed_by: Decisions Leaf
  closure_note: >
    MOOT, NOT DECIDED. This entry asked whether to amend refusal R7. Spine 0.2 withdrew R7 outright —
    "iOS is in scope. The refusal that replaces it: no platform gets a feature the other cannot have on
    equivalent hardware (C11)" (SPINE.md §6, changelog 0.2). The question this entry poses therefore no
    longer has a subject, so it is closed as superseded rather than resolved_human: nobody answered it
    as written, and the Decisions Leaf does not stamp decisions on Hari's behalf. The "when" half of the
    question survived the bump and is now D-041 (launch shape — and Compliance's finding that Apple has
    no 12-tester gate inverts this entry's sequencing assumption). The "what is iOS for" half, which
    this entry said "belongs in the Spine if adopted", is now D-040 and is still unanswered. The
    analysis itself is kept at leaves/architecture/ios-port.md, re-stamped 0.2 and partly superseded by
    architecture.md §§2-4.
  blocks_release: false
  raised_by: [Hari, Architecture]
  context: >
    Hari asked what a simultaneous iOS launch would take. SPINE R7 refuses iOS in iteration-1.
    Analysis in leaves/architecture/ios-port.md: the native core ports for free (engine.cpp is
    already built on macOS by the host smoke test) and the fd-window/alignment complexity
    disappears, because an iOS bundle is a directory. Rebuilt: SwiftUI UI, background rules
    (~30s, not ~3 min), memory-pressure handling, report hand-off, and the gate, which on iOS
    cannot offer to uninstall. Two consequences matter more than the code: C3 is provable on
    Android by a missing permission and is only a promise on iOS, and there is no App Store
    device-exclusion catalogue, so the RAM floor must be enforced by a higher minimum iOS
    version plus a runtime gate. Cost 99 USD/year plus a 3-4 GB test iPhone; 2.5-4 weeks to
    TestFlight. True simultaneity would mean delaying Android, whose production date is fixed
    by Play's 12-tester, 14-day closed test.
  options:
    - hold R7 for iteration-1; revisit after Android production
    - port during the 14-day closed-test window and launch both together
    - port now, in parallel with the Android phone work
  recommendation: >
    Option 2 if iOS is wanted at all: the closed-test wait is calendar time that costs nothing
    else, and by then W02/W04 have settled model size, RAM floor and quality, so both platforms
    inherit one set of answers. Option 3 doubles the surface before a single number exists on a
    real phone. Decide first what iOS is *for*: the Spine's persona is on Android, so the honest
    reasons are credibility, press and diaspora reach, and they belong in the Spine if adopted.
  if_rejected: "n/a — the Spine bump removed the question; see closure_note."
  historical_if_rejected: no code changes; ios-port.md stays an analysis and R7 stands.


