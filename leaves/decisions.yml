- id: D-047
  title: The increased-memory-limit entitlement — not in iteration-1, and a profile requirement rather than a platform flag
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C2, C11, C8, C3]
  platform: ios
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [Compliance, Architecture]
  merged_from:
    - "Compliance D-039 (appstore-policy-checklist.md §8, §16.2)"
    - "Architecture §3.3 / §3.4 (the entitlement, and what is shippable)"
  contradiction_flag: >
    THE CODE CURRENTLY DOES THE OPPOSITE OF BOTH RECOMMENDATIONS. ios/App/Support/Arivu.entitlements
    requests com.apple.developer.kernel.increased-memory-limit and is commented as doing so deliberately
    ("insurance against a transient spike during the first map, not a load-bearing part of the plan")
    [V-local]. Compliance and Architecture both recommend not requesting it in iteration-1. This entry
    is the place that disagreement gets settled; tools/ios_release_check.sh does not fail on its
    presence, it only NOTEs it.
  context: >
    com.apple.developer.kernel.increased-memory-limit is a Boolean, iOS 15.0+ [V-doc]. Apple's own text:
    it indicates "core features of your app may perform better with a higher memory limit on supported
    devices"; "if you use this entitlement, make sure your app still behaves correctly if additional
    memory isn't available"; and "an increased memory limit is only available on some device models"
    with no list published [V-doc]. Architecture draws out three consequences: it grants nothing
    specific, Apple REQUIRES the app to work without it (so it can never be a precondition for a
    profile, only a raise to the number the probe reads), and how you enable it is genuinely unsettled —
    an Apple DTS engineer said it appears only in Certificates, Identifiers & Profiles and not in
    Xcode's Signing & Capabilities editor [V-fwd], while a 2026 community write-up says Xcode now offers
    it [C]. Whether App Review questions it is UNVERIFIED in both directions. Compliance's own reasoning
    for leaving it out: an unused entitlement means an extra App ID capability, an entitlement that is
    silently stripped if it is missing from the distribution profile, and a line in the binary inviting
    a question Arivu has no reason to answer. Architecture adds a fourth: the first submission already
    carries one question (on-device model output, D-017/D-026) and this would add a second.
    Both Leaves also agree on the shape of the answer if it is ever adopted, and that part is the C11
    content of this entry: it must be an INPUT TO THE PROBE, not a platform switch. On a device where it
    is granted and effective, os_proc_available_memory() returns a bigger number, arivu_profile_select
    picks a richer profile over the same candidate list, and no code names iOS. An entitled iPhone and
    an 8 GB Android phone arrive at the same profile by the same arithmetic.
    Neither Leaf has measured anything on an iPhone. The relevant figures are estimates: compact peaks
    around 670 MB RSS and, if clean mapped pages are not charged, around 300 MB of phys_footprint,
    against a jetsam budget reported at roughly 1.3-2 GB on a 4 GB device [C — Apple publishes no
    numeric limits anywhere]. W81 settles it in an afternoon.
  options:
    - "Do not request it in iteration-1; record it as a precondition of any larger profile, and remove it from ios/App/Support/Arivu.entitlements (Compliance and Architecture)"
    - "Keep it as insurance, as the landed entitlements file does, and note the justification in App Review Information"
  recommendation: >
    The first option, because both Leaves that studied the documentation reached it independently and
    the file that disagrees was written before §3 existed. Two caveats worth carrying: the entitlement
    is cheap to add later and expensive to explain now (Architecture), and MULTIPLATFORM.md's caution 1
    is right that any future 3B/4B profile depends on it — so the removal must be recorded as "not
    needed by compact", not as "rejected", or the next person re-litigates it from scratch. If Hari
    prefers the insurance, W81 should confirm it is actually granted and effective on the test iPhone,
    because "we assumed it worked" is how a larger-model plan dies at submission.
  implemented_provisionally: "yes, CONTRARY to the recommendation — the entitlement is requested in ios/App/Support/Arivu.entitlements [V-local]"
  if_rejected: "keep the entitlement and the App ID capability; add a line to App Review Information explaining why a 400 MB model app asks for a higher memory limit."

- id: D-048
  title: The headroom margin in arivu_profile_fits
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C2, C6, C11]
  platform: both
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [Architecture]
  merged_from: ["Architecture D-043 / boundary review B24 / request R-b (architecture.md §2.3, §10, §11)"]
  depends_on: [W81, W82]
  context: >
    arivu_profile_fits accepts when available_memory_bytes >= estimated_peak_bytes, exactly, with no
    margin [V-local]. Apple documents os_proc_available_memory() as advisory, not to be cached and not
    to be consumed up to, and jetsam then kills with no callback [V-doc]. Accepting at 1.00x accepts a
    device that fits until the user opens the camera. Architecture's related correction (B23, W82) is
    that the two sides of that inequality are in different currencies on iOS: the estimate adds
    model_bytes, but jetsam charges phys_footprint, which excludes the clean file-backed pages the
    weights live in — so as written the check will REFUSE iPhones that would have worked. Both need
    settling together, and W81 (peak RSS and peak phys_footprint on a physical iPhone) is the
    measurement that turns both into arithmetic instead of taste.
  options:
    - "(a) No margin — today's behaviour"
    - "(b) A single multiplier carried in the profile"
    - "(c) A per-platform margin supplied by the shell alongside the device measurement, keyed on the QUALITY of the measurement rather than on the platform"
  recommendation: >
    (c), Architecture's recommendation, with its C11 defence recorded because it will be challenged:
    the margin belongs to the quality of the measurement, not to the platform. Android infers headroom
    from totalMem and cannot probe it (available_memory_bytes == 0 means "not measured"); iOS probes an
    advisory number that moves. A field that says "Android measured this and iOS could not" is fine; a
    field that says "on iOS, do less" is not. Architecture's interim values: 1.25 where the number is
    inferred, 1.4 where it is probed — from W81, not from taste. This also wants Architecture's request
    R-c: a provenance flag on arivu_device saying whether available_memory_bytes was probed or inferred.
  implemented_provisionally: "no — arivu_profile_fits has no margin today [V-local]"
  if_rejected: "(a) leaves the first iOS gate screen untrustworthy in the generous direction and B23 untrustworthy in the mean direction; (b) is simpler but cannot express the asymmetry that actually exists."

