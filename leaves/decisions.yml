- id: D-015
  title: Weight repacking and KleidiAI
  raised_at: 2026-09-15
  sla_expires_at: 2026-09-17
  spine: [C2]
  platform: both
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [Engineering]
  depends_on: [W02, W03]
  context: >
    Repacked ARM kernels are faster but copy weights into anonymous memory (~400 MB unreclaimable),
    which breaks the "weights are evictable" memory model. Off by default; W02 runs repack=false,true.
    KleidiAI also downloads sources at build time (FetchContent disabled, threat-model.md T6). No new evidence.
  options: [repack off (current), repack on]
  recommendation: decide from tok/s vs peak RSS in W02.
  implemented_provisionally: "repack off (Policy.REPACK_WEIGHTS)"
  if_rejected: flip Policy.REPACK_WEIGHTS; peak RSS budget grows ~400 MB (M3 at risk).
  cross_platform: >
    Both platforms, and the iOS bill is worse (architecture §3.2 point 2): repacking moves ~373 MB of
    weights from clean file-backed pages, which jetsam does not charge, into anonymous memory, which it
    does. The answer does not change; whoever revisits it for a speed win on a flagship needs to know
    the two platforms are not paying the same price.

