- id: D-038
  title: Profiles are the C11 mechanism — where the candidate list lives, and what the capability vocabulary is
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C11, C2, C8, R2, R3]
  platform: both
  adjudication: human
  status: pending
  blocks_release: true
  blocks_release_scope: ios
  deadline: before the first iOS build ships anything; does not hold the Play release
  raised_by: [Architecture, Core/Android Engineering, GTM]
  merged_from:
    - "Architecture D-038 (profiles as the C11 mechanism, architecture.md §2, §11)"
    - "GTM D-GTM-A (is `tools` a profile capability or a product boundary? positioning.md §4, §9)"
    - "Core/Android Engineering, unnumbered (engineering.md 'Profiles — what the device gets a say in' and its open item on convergence with core/)"
  depends_on: [W77, W78]
  context: >
    C11 says an 8 GB Android phone and an 8 GB iPhone get the same profile. Architecture §2.1 names the
    failure mode it forbids, and it is convenience rather than malice: someone measures a 4B model on an
    iPhone, it works, longform ships "on iOS", and six weeks later Android flagship users get a shrug.
    The fix is to make "which platform" unavailable as an input to any feature decision. During this
    round the Core/Tools Leaf landed exactly that in /core — arivu_profile, arivu_device, arivu_fit,
    arivu_profile_valid, arivu_profile_fits, arivu_profile_select, arivu_profile_context_params, with
    unit tests [V-local, core/include/arivu/arivu.h, core/src/profile.cpp]. Architecture reviewed it and
    says it is a better answer than the shared-YAML design it was going to propose, because selection
    arithmetic written once has zero drift while arithmetic written twice against a fixture has merely
    detectable drift (§2.2). Two things are unfinished and one is a tripwire.
    (1) NO SHELL CALLS IT YET (architecture B16). Policy.kt remains a hardcoded tier, there is no
    DeviceProbe on either platform, and nothing fills in arivu_device — so C11 has a mechanism and no
    user. Engineering's own open item says the same and calls three copies of the numbers (core, Kotlin,
    Swift, held in step only by the source-text ProfileParityTest) "deliberate for one pass and a
    liability for two".
    (2) arivu_default_profile() lives in the core and IS product policy below the boundary. Architecture
    endorses that while exactly one profile is shippable, and records the tripwire: the moment a second
    profile is shippable, the candidate list must be constructed above the boundary, or /core quietly
    becomes where product decisions live and nobody can say why the app behaves as it does without
    reading C++.
    (3) GTM's limb of the same question (positioning.md §4): what may enter the capability vocabulary at
    all. GTM's answer is that longform is a profile and `tools` is a product boundary — more context is
    the same verbs on a longer document, while tool calling makes the app go and do things, which is R2,
    a different audience, and on whichever platform shipped it first an unanswerable question about why
    the other app is "worse". Architecture's fork test (§6) reaches the same verdict independently:
    tool calling fails three of its four tests. ARIVU_CAP_TOOLS exists in the bitmask and is marked
    reserved; both Leaves treat it as a tripwire, not a roadmap.
  options:
    - "(a) Ratify the landed design — arithmetic and arivu_default_profile() in /core — and accept the §2.2 tripwire, with the capability vocabulary closed to [chat, longform] and any addition a Spine amendment argued once for both platforms"
    - "(b) Move the candidate list above the boundary now, into each shell"
    - "(c) Leave Policy.kt per platform and revisit when iOS forces it"
  recommendation: >
    (a), which is Architecture's recommendation with GTM's constraint attached. The mechanism is built
    and tested; one implementation means zero drift; (b) is cost with no benefit while there is one
    shippable profile; (c) is the two-Policy-files future whose cost is paid later and by someone else.
    Accepting (a) carries two consequences worth stating in the same breath: the shells must actually
    consume it (W77 Android, W78 iOS) and the Kotlin arithmetic should be deleted rather than kept in
    step by a parity test; and the tripwire needs an owner, because a tripwire nobody watches is a
    comment. The first real test of C11 is not compact vs standard — it is the day an 8 GB Android phone
    and an 8 GB iPhone run the same candidate list and get the same index.
  implemented_provisionally: >
    partly — the core object, selector and tests exist [V-local]; ProfileSelector.select (Kotlin) and a
    Swift copy re-implement the same rule; ProfileParityTest keeps the three sets of numbers in step by
    source text. No shell fills in arivu_device (architecture B16).
  if_rejected: >
    (b) means writing and maintaining a candidate list in Kotlin and Swift now, for one profile.
    (c) means two Policy files and a C11 that is a sentence in the Spine with nothing enforcing it; the
    fork arrives quietly, as a #if os(iOS) around a feature rather than a decision anyone made.

- id: D-039
  title: The iOS privacy claim — the wording, and the check that is allowed to back it
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C3, C5, C11]
  platform: both
  adjudication: human
  status: pending
  blocks_release: true
  blocks_release_scope: ios
  deadline: before any iOS listing, privacy text or screenshot is written; before the first App Store submission
  raised_by: [Design, Compliance, GTM, iOS Engineering]
  merged_from:
    - "Design D-038 (the iOS privacy claim, design.md §12)"
    - "Compliance D-041 (how the iOS listing words the privacy claim, appstore-policy-checklist.md §16.2)"
    - "GTM D-GTM-C (does the iOS privacy wording get its own approved text?) and D-GTM-D (does a release check exist that fails on networking code?), positioning.md §7, §9"
    - "iOS Engineering, engineering-ios.md 'Remaining manual steps' 12 ('settle D-038 — the iOS app must not ship Android's no-permission sentence')"
  depends_on: [W73]
  context: >
    This is the product's headline claim and the one place where two platforms cannot say the same true
    thing. On Android, C3 is proved by absence — no INTERNET permission, enforced by the OS and asserted
    on every build by tools/check_manifest.sh [V-local]. iOS has no permission to withhold. Three Leaves
    raised it independently and all three reject reusing the Android sentence: Design ("it is not
    true"), Compliance ("this is a genuine weakening, and it changes the listing copy, not the form"),
    GTM (which lists the exact phrases that must never cross: "cannot go online", "no permission to use
    the internet", "Android does not let it send anything anywhere", "a missing permission, not a
    promise"). GTM ranks the iOS receipts by actual strength: the shipped binary links nothing that can
    reach the network; the source is public (D-035); the user's own Airplane Mode test, which needs no
    trust and no expertise and is the one the listing should lead with; and App Privacy "Data Not
    Collected" last, because it is a self-declaration Apple does not verify. GTM also states the limit
    so nobody overshoots it: App Store binaries are re-signed and encrypted by Apple, so a user cannot
    verify the shipped app was built from the published source — the reproducible-build argument does
    not transfer. We claim no networking capability in the binary and no networking code in the source.
    We do not claim this binary is that source.
    The check that would make the strongest sentence true does not exist yet. Architecture §5.5 and B20
    propose tools/check_ios_binary.sh (otool -L, nm -u, failing on CFNetwork, Network, libcurl and the
    URLSession/socket/connect/getaddrinfo symbol set) as W73; Compliance's tools/ios_release_check.sh
    already asserts no networking framework, symbol, entitlement or Info.plist key, but has only ever
    run against a synthetic fixture bundle. GTM's D-GTM-D is the discipline that follows: until the
    check ships and its exact guarantee is written down, the listing says "no networking code" (true,
    checkable in source) and NOT "our build check fails if any is added". Architecture is honest about
    the residual gap either way: a linked framework is capability, not use, so the check proves the
    capability is absent, not that intent was good.
  options:
    - "(a) Reuse the Android sentence on iOS — rejected by Design, Compliance and GTM; it is a false claim"
    - "(b) iOS-specific copy that says exactly what is checkable and who checks it, in GTM's receipt order, with the build-check sentence bracketed until W73 ships"
    - "(c) Say nothing about the network on iOS and lead on 'works offline'"
    - "(d) Hold iOS until a stronger proof exists"
  recommendation: >
    (b). All four Leaves land there. Compliance owns the final text, GTM owns the listing rendering,
    Design's requirement is only that the iOS sentence be DIFFERENT from the Android one and just as
    plain — a weaker true sentence is fine, the same sentence in both apps is not. Compliance's draft:
    "Arivu has no networking code. The build is open source and the release check refuses a build that
    links one" — with the second clause held back until W73 exists. C5 is the commitment to being honest
    about what Arivu is, and this is the first place where honesty costs a good sentence.
  implemented_provisionally: >
    partly — design.md §9 gives privacy_internet_body an iOS variant that describes the absence of
    networking code rather than enumerating permissions, and engineering-ios.md reports a test in
    ArivuKit that already fails if the Android sentence ships. The hosted policy, the App Store listing
    and the tour still carry Android-shaped sentences.
  if_rejected: >
    (a) GTM reuses the Android copy and the weakening is recorded in leaves/NOTES.md so nobody
    rediscovers it — but the claim is then false on iOS, which is the one thing C5 forbids.
    (c) costs the strongest thing Arivu has to say in the one market where it matters most.
    (d) is coherent and means no App Store submission this iteration.

- id: D-040
  title: What is iOS for, in one sentence in the Spine?
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C11, C5]
  platform: both
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [GTM, Architecture, Hari]
  merged_from:
    - "GTM D-GTM-B (positioning.md §9)"
    - "the unanswered half of D-037 ('Decide first what iOS is for'), which survived the Spine 0.2 bump"
    - "Architecture 'Needs Hari' 5 and architecture/ios-port.md 'The question worth asking first'"
  blocks: [D-041]
  context: >
    Spine 0.2 withdrew R7 and put iOS in scope, but it did not say what iOS is for. Every other iOS
    question inherits the answer: whether shipping iOS first undercuts the story (D-041), how wide the
    storefront availability should be (D-059), how much an 18+ rating's discoverability cost matters
    (D-024), and whether a gate screen seen by many iOS users is acceptable (D-042, D-045). The Spine's
    persona is a teacher in Enugu on a 4 GB Android phone rationing prepaid data; in those markets iOS
    is a small minority and iOS users are the least likely to be blocked by data costs. ios-port.md put
    it plainly: an iOS build mostly buys credibility, press and diaspora reach — real things, but not
    the Spine's problem statement — and if that is the reason it should be written into the Spine rather
    than left implicit.
  options:
    - "GTM's sentence: 'iOS reaches the people who recommend Arivu, and is where the second device profile is proven before an 8 GB Android phone inherits it.' Placed in SPINE §2 or beside C11"
    - "A different sentence Hari writes"
    - "Leave it implicit and decide each downstream question on its own merits"
  recommendation: >
    GTM's sentence, or Hari's own — but written down. This is a Spine amendment, so only Hari makes it,
    and the Decisions Leaf's only contribution is that leaving it implicit is the expensive option: the
    same argument then gets re-run, differently, in four other entries. The second limb of GTM's
    sentence is worth keeping whatever the first says, because it is the only stated reason iOS helps
    Android rather than competing with it for attention.
  implemented_provisionally: "n/a (a Spine edit)"
  if_rejected: >
    No code changes. D-041, D-059 and the D-024 weighing each get decided without a shared premise, and
    the README problem MULTIPLATFORM.md warns about — a product that cannot say what it is — arrives by
    a different road.

- id: D-041
  title: Launch shape — iOS has no 12-tester gate, so it could ship first
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C1, C11]
  platform: both
  adjudication: human
  status: pending
  blocks_release: false
  evidence_settles: true
  evidence_settles_scope: >
    THE FACTUAL PREMISE ONLY, and it still needs Hari's stamp. That Apple imposes no tester gate is
    settled; which launch shape to adopt is a judgement that depends on D-040 and remains Hari's.
  evidence_source: >
    appstore-policy-checklist.md §10 — Apple's enrolment page was fetched and contains no testing
    requirement of any kind, and TestFlight imposes no minimum tester count or duration [V: absent].
    Compliance flags the one caveat honestly: a universal negative cannot be proved from vendor docs,
    so confirm it once the account exists, which costs nothing.
  raised_by: [Compliance, GTM, Architecture]
  merged_from:
    - "Compliance D-038 (iOS has no 12-tester/14-day gate — does that change the launch shape? appstore-policy-checklist.md §16.2)"
    - "GTM D-GTM-J (do the two launches have to be the same day? positioning.md §9)"
    - "Architecture B12 (architecture.md §10)"
  depends_on: [D-040]
  context: >
    THE EVIDENCE INVERTS THE OLD PLAN. architecture/ios-port.md assumed the shape "Android's 14-day
    closed test is dead time, so the iOS port happens inside that window and the two launch together".
    Compliance checked and Apple has no equivalent gate at all: enrolment (99 USD/yr, 2FA, legal name or
    a D-U-N-S) and then App Store review, typically days. Play's rule stands — personal accounts created
    after 2023-11-13 need 12 testers opted in continuously for 14 days before applying for production
    [V, answer/14151465]. So iOS could reach the store BEFORE Android production, not after. Architecture
    B12 records the same inversion and calls it a sequencing question, not an architecture one. GTM adds
    the mechanical asymmetry that decides the shape: Play cannot hold a first release, Apple can — an
    iOS build submitted with "Manually release this version" waits for a date of our choosing.
    MULTIPLATFORM.md's standing rule is that an Android fix is never held for App Store review.
  options:
    - "Hold iOS until Android production, purely for narrative coherence"
    - "Ship iOS whenever it is ready, and accept that the offline-Android app debuts on iPhone"
    - "Couple the announcement, not the release — submit iOS with manual release and release it on the day Play goes live; if iOS is not approved, Android ships alone (GTM)"
  recommendation: >
    GTM's third option, contingent on D-040. If iOS exists for credibility and press, shipping it first
    undercuts the story the product tells about 2-dollar phones and prepaid data (Compliance); if it
    exists to be used, waiting costs users nothing and buys nothing. Coupling the announcement rather
    than the release is the only option that survives either answer, and it keeps MULTIPLATFORM.md's
    rule intact. Sequencing should also correct ios-port.md's assumption and take the 14-day closed test
    off the "free budget" framing — it is still Android's critical path (Architecture B12 noted it was
    not on it; it is).
  implemented_provisionally: "n/a (Console and calendar)"
  if_rejected: >
    No code changes. Shipping iOS first is defensible if D-040 says iOS is for being used; it is hard to
    defend if D-040 says iOS is for credibility.

- id: D-042
  title: The minimum iOS version — the only pre-install filter the App Store has
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C6, C2, C11]
  platform: ios
  adjudication: human
  status: pending
  blocks_release: true
  blocks_release_scope: ios
  deadline: before the App Store listing can be finished (it is a listing placeholder) and before the first submission
  raised_by: [iOS Engineering, Design, Compliance, Architecture, GTM]
  merged_from:
    - "iOS Engineering D-047 (iOS deployment target 17.0, engineering-ios.md)"
    - "Design D-043 (iOS exclusion is a higher minimum iOS version, not a catalogue, design.md §12)"
    - "Compliance appstore-policy-checklist.md §12 (the device floor)"
    - "Architecture §2.7 and 'Needs Hari' 3"
    - "GTM appstore-listing.md placeholders [MIN_IOS], [DEVICE_FLOOR]"
  depends_on: [D-009, W02, W81]
  context: >
    There is no App Store device-exclusion catalogue. Play has three gate layers; iOS has one and a
    half — MinimumOSVersion plus the runtime gate (Compliance §12). So the OS floor is a proxy for
    silicon and roughly for a RAM class, and it is the only thing standing between a user and a ~400 MB
    download that ends at a wall. Architecture states the rule: the pre-install filter and the runtime
    gate must agree — the minimum iOS version is the lowest version whose slowest supported device still
    passes arivu_profile_fits for compact; anything looser meets C6 in letter and breaks it in spirit.
    Architecture also says plainly that this is a product decision, not a build setting. Design's input
    is that the higher the floor, the fewer people meet the gate screen at all, and the gate on iOS is a
    first impression rather than an edge case. GTM cannot finish the listing without the number.
    NOTE THE TENSION, because it is the reason this is on the queue: ios/project.yml already sets
    deploymentTarget iOS 17.0 and IPHONEOS_DEPLOYMENT_TARGET 17.0 [V-local], and iOS Engineering
    recommends 17.0 as implying A12 or newer — but that number was chosen before W02 (the Android phone
    benchmark) and W81 (the first physical-iPhone memory characterisation) exist. It is a reasonable
    provisional value, not a derived one.
  options:
    - "17.0 — as landed; implies A12 or newer (iOS Engineering)"
    - "16.0 — more reach, more gate screens, more 'it's slow' reviews per thousand installs"
    - "18.0 — fewer gate screens, materially smaller installed base"
    - "Defer the final number until W81 and W02, keeping 17.0 as the provisional build setting"
  recommendation: >
    The fourth option, with 17.0 as the interim: ratify 17.0 for the first TestFlight build, and derive
    the shipping number from the same measurement that sets D-009's RAM floor, as Compliance and
    Architecture both ask. Record both floors side by side in leaves/NOTES.md so the two platforms'
    gates are visibly one decision. Raising the floor later drops users, so the cost of being too low is
    paid by users and the cost of being too high is paid once, by us.
  implemented_provisionally: "yes, provisionally — ios/project.yml deploymentTarget iOS 17.0 [V-local]"
  if_rejected: >
    A different number in ios/project.yml before the first archive, plus the [MIN_IOS] and
    [DEVICE_FLOOR] lines in appstore-listing.md. Raising it after release drops installed users.

- id: D-043
  title: What happens to a reply when the user backgrounds the app on iOS (C10)
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C10, C2, C11]
  platform: ios
  adjudication: human
  status: pending
  blocks_release: true
  blocks_release_scope: ios
  deadline: before the first TestFlight build behaves one way or the other in front of a tester
  raised_by: [Architecture]
  merged_from: ["Architecture D-039 / boundary review B17 (architecture.md §10, §11)"]
  context: >
    C10 promises generation "survives a brief app switch". Android delivers it with a shortService
    foreground service, roughly three minutes, verified on the emulator (D-003). iOS offers
    beginBackgroundTask, conventionally about 30 seconds [B — Architecture flags that the documented
    figure needs checking and that iOS has historically granted less than folklore says]. A 768-token
    reply at 8 tok/s is about 96 seconds and will NOT finish backgrounded on iOS. This is a genuine
    mismatch with a Spine commitment, not an implementation detail, which is why it is here rather than
    in a work item.
  options:
    - "(a) Stop and keep the partial reply when backgrounded, exactly as process death already does on Android (throttled 2 s save, 'Stopped' label, Copy and Report still on the reply)"
    - "(b) A shorter max_reply_tokens on iOS profiles"
    - "(c) Weaken C10's wording"
  recommendation: >
    (a), Architecture's recommendation. It reuses behaviour that already exists and was already user-
    tested on the Android side, it is honest, and it needs no platform-specific limit — (b) would be one,
    and a reply cap that differs by platform is precisely what C11 forbids, since max_reply_tokens is a
    profile field and a profile is supposed to follow the device. Design's adjacent requirement
    (design.md §14 request 2) is that the background-expiration handler route into the SAME cancel path
    as the Stop button, so the partial reply is saved by the same throttled save and labelled
    stopped_backgrounded. If (a) is accepted, C10's sentence is still true on both platforms; the
    mechanism differs and the difference is forced by the OS, which is the template §2.7 sets for every
    divergence.
  implemented_provisionally: "no — no iOS build has run"
  if_rejected: >
    (b) puts a platform-shaped number in a profile and needs a C11 argument in writing.
    (c) is a Spine edit and only Hari makes those.

- id: D-044
  title: No local notifications on iOS
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C3, C8, C10]
  platform: ios
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [Design]
  merged_from: ["Design D-041 (design.md §12)"]
  related: [D-043]
  context: >
    A background reply that runs out of time (D-043) has to be surfaced somehow. The alternative to
    silence is a local notification, and a local notification needs a permission prompt — which would be
    the first permission prompt in a product whose entire pitch is that it asks for nothing. Design's
    position: the reply is reported when the user returns, not pushed. engineering-ios.md makes the same
    point from the other side — the app that asks for nothing does not open with a permission dialog.
  options:
    - "No notifications; the partial reply and its label are simply there when the user comes back (recommended)"
    - "Ask for notification permission at the first background generation"
  recommendation: >
    No notifications. Design's reasoning holds on its own, and it also protects the D-039 privacy claim
    from having to explain why a no-network app wants to send the user alerts.
  implemented_provisionally: "yes, by construction — no notification code and no UNUserNotificationCenter usage in ios/App [V-local]"
  if_rejected: "add the permission request and the notification; the 'asks for nothing' line in the listing and the tour changes."

- id: D-045
  title: The iOS gate screen has no button
  raised_at: 2026-09-16
  sla_expires_at: 2026-09-18
  spine: [C6, R8, C11]
  platform: ios
  adjudication: human
  status: pending
  blocks_release: false
  raised_by: [Design, Architecture, iOS Engineering]
  merged_from:
    - "Design D-042 (design.md §12)"
    - "Architecture §2.7 (a device that qualifies for no profile)"
    - "iOS Engineering (engineering-ios.md — 'instructions instead of a dead button')"
  related: [D-042]
  context: >
    On Android the Incompatible screen offers ACTION_DELETE and the system uninstall dialog (D-006,
    verified on an API 36 emulator). iOS apps cannot offer to uninstall themselves. Architecture's table
    also records what makes this sharper than it looks: with no device-exclusion catalogue the iOS gate
    is reached OFTEN rather than rarely, and the user reaching it has already paid for a ~400 MB
    download she cannot un-pay. Design's note: it is the first screen some iOS users will ever see.
    Same screen, same words, no button, plus one line saying how to remove the app.
  options:
    - "No button, plus one line of removal instructions (recommended)"
    - "A button that opens Settings"
    - "A 'Close Arivu' button"
  recommendation: >
    No button plus the removal line. A Settings button cannot reach the uninstall flow and a "Close"
    button is a dead end wearing a hat. Two things should travel with this decision: the gate should say
    WHY, from arivu_fit_name() — not enough memory, not enough free storage, wrong architecture — with
    the same copy on both platforms (Architecture's W83, arivu_fit is described as "a product gift
    nobody asked for"); and D-042 is the lever that decides how many people ever see the screen.
  implemented_provisionally: "partly — ios/App/Sources/IncompatibleView.swift exists and carries the no-button shape; the per-reason wording (W83) does not exist on either platform"
  if_rejected: "add the button; Design and Compliance both need the App Review note updated, since a reviewer on a current iPhone will never see this screen."

