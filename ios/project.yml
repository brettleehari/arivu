# XcodeGen spec for the Arivu iOS app.
#
# The .xcodeproj is generated, never committed: an Xcode project file is a merge-conflict machine and
# nothing in it is a decision worth reviewing. `tools/ios/generate_project.sh` runs xcodegen if it is
# installed and tells you how to install it if not.
#
# VERIFIED on a device. This spec generates, builds, links, signs and installs: Debug for
# iphonesimulator and for iphoneos, signed with an Apple Development certificate and installed on an
# iPhone 17 Pro Max (iOS 26.7) with the 378 MB model in the bundle. What is still unproven is
# Release, archiving and anything needing a paid team — the enrolment is pending.
#
# spine: C1, C3, C8

name: Arivu
options:
  bundleIdPrefix: io.github.brettleehari
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # ArivuKit is built in Swift 6 language mode and `swift test` proves it; the app target follows.
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # the model copy phase reads models/ at the repo root
    DEAD_CODE_STRIPPING: YES
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # ArivuCore.xcframework ships ONE simulator slice, arm64, and that is deliberate:
    # tools/ios/build_core.sh refuses to build an x86_64 slice because it would serve only Intel
    # Macs, which cannot run a useful benchmark anyway. Without this line Xcode still tries to build
    # the simulator for x86_64 as well and the link fails with "missing architecture(s) required by
    # this target (x86_64)" — which is what the first simulator build of this app actually did.
    # Encoded here rather than passed on the xcodebuild command line so the GUI behaves the same way.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # D-043: the App Store has no device-exclusion catalogue, so the minimum iOS version is the only
    # exclusion there is. 17.0 implies an A12 or newer with >= 3 GB; the runtime gate does the rest.
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

# The commit the build came from, written by tools/ios/generate_project.sh and read by Info.plist
# as ARIVUGitSHA. Two builds of an app that looks the same are otherwise indistinguishable.
configFiles:
  Debug: App/Support/Build.xcconfig
  Release: App/Support/Build.xcconfig

packages:
  ArivuKit:
    path: ArivuKit

targets:
  Arivu:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # The asset catalogue must be compiled by actool, so it is a normal source, not a folder ref.
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # A FOLDER REFERENCE, on purpose: the app looks the licence texts up with
      # `subdirectory: "licenses"`, which only works if the directory survives into the bundle.
      # Added as a group, Xcode would flatten it and every licence row would open onto nothing.
      - path: App/Resources/licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: ArivuKit
        product: ArivuKit
      # Built by tools/ios/build_core.sh. Static, so it is linked and not embedded: an embedded
      # dynamic framework would add a dylib to load at launch for no benefit.
      - framework: ../build/ios/ArivuCore.xcframework
        embed: false
        link: true
      # Required by the XCFramework above, not by any Swift in this app. tools/ios/build_core.sh
      # builds ggml with GGML_ACCELERATE=ON — Apple's BLAS for prompt processing, CPU-side, and so
      # no extra dirty memory — which leaves ggml referencing vDSP_maxv, vDSP_measqv and vDSP_sve.
      # Without this the first link of the app fails with "Undefined symbols for architecture
      # arm64: _vDSP_maxv ... referenced from _ggml_compute_forward_soft_max". A build flag in one
      # script and a link dependency in another file have to be changed together; if Accelerate is
      # ever turned off there, this line goes with it.
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.brettleehari.arivu
        # Signing lives here, not in Xcode's UI, for the same reason everything else does: the
        # project is generated and anything set through the UI is gone at the next regeneration.
        # That is not hypothetical — the bundle id had already drifted to
        # "io.github.brettleehari.arivu.dev" in the generated project while this file still said the
        # real one, and the .dev suffix was not even needed: the canonical id provisions fine.
        # D-001 makes that identifier irreversible once uploaded, so it must not drift again.
        #
        # The team id is not a secret — it ships inside the provisioning profile of every signed
        # app. A fork replaces this line, or overrides it for one build with
        #   xcodebuild ... DEVELOPMENT_TEAM=<theirs>
        DEVELOPMENT_TEAM: AJ4SSKV57N
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Arivu
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Support/Arivu.entitlements
        # iPhone only, like the Android build: the layouts and the memory budget are phone-shaped.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandGreen
        # llama.cpp and the Arivu core are C++; the app needs the C++ runtime to link them.
        OTHER_LDFLAGS: "-lc++"
        # A 400 MB resource makes a debug build slow to install; nothing here is size-sensitive at
        # runtime, so the model is never compressed or stripped.
        STRIP_INSTALLED_PRODUCT: YES
        COPY_PHASE_STRIP: NO
    preBuildScripts:
      - name: Copy the model into the bundle
        # The GGUF is not in the repo (models/ is gitignored, fetched by tools/fetch_model.sh).
        # Copying it is a build phase so a fresh clone fails loudly rather than shipping without it.
        script: "\"$SRCROOT/../tools/ios/copy_model.sh\""
        inputFiles:
          - $(SRCROOT)/../models/Qwen3-1.7B-Q4_K_M.gguf
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/qwen3-1.7b-q4_k_m.gguf
        basedOnDependencyAnalysis: true
    postBuildScripts:
      - name: Refuse to ship a placeholder or a bundle with no model
        # The iOS twin of tools/release_check.sh (D-010). AFTER the build, because it inspects the
        # bundle that was produced; and only when installing, so a laptop debug build still works.
        script: "\"$SRCROOT/../tools/ios/check_release.sh\""
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: true

  ArivuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
        optional: true
    # ONLY the app. Not the ArivuKit package and not the XCFramework: this bundle is hosted by
    # Arivu.app, which already links both, and naming them again is an error —
    #   "Swift package product 'ArivuKit-product' is linked as a static library by 'ArivuTests'
    #    and 'Arivu'. This will result in duplication of library code."
    # Being hosted is also what makes CoreParityTests work at all: the real core arrives through
    # the host app, which is the only place ArivuCore.xcframework is linked, so this is the one
    # target where the Swift copies are actually compared against the C instead of skipping.
    dependencies:
      - target: Arivu
    settings:
      base:
        # The ArivuKit suites run on macOS with `swift test`; this bundle exists for the few things
        # that can only be checked on a device or the Simulator (the model is really in the bundle,
        # the privacy manifest parses, the app launches into a chat and nothing else).
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Arivu:
    build:
      targets:
        Arivu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArivuTests
    archive:
      config: Release
