  cross_platform: >
    Both platforms. The system prompt is now byte-identical in Policy.kt and Policy.swift, asserted by
    ProfileParityTest.theSystemPromptIsByteIdenticalOnBothPlatforms (appstore-policy-checklist.md §1b).
    Sampling is the profile's, not the platform's (D-038).

