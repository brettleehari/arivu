# Android job (MULTIPLATFORM.md "CI"): testDebugUnitTest, lintRelease, bundleRelease,
# check_manifest.sh, alignment check. Linux runner — no Apple SDK is involved in shipping Android.
#
# Path-filtered: an iOS-only commit does not build an AAB. A /core commit fans out to this job and
# to `core`, which is the point — core is the only thing that should trigger both.
name: android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'core/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'core/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: unit tests + lint + bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODEL_PATH: models/Qwen3-0.6B-Q4_K_M.gguf
      AAB: android/app/build/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # AGP would download most of this itself, but pinning it makes a failure legible, and the NDK
      # android/app/build.gradle.kts names (29.0.14206865) must not be silently substituted: the
      # 16 KB alignment the Spine depends on comes from NDK r27+.
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37" "ndk;29.0.14206865" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache llama.cpp checkout
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp
          key: llama-${{ runner.os }}-${{ hashFiles('tools/llama/fetch_llama.sh', 'tools/llama/patches/*.patch') }}

      - name: Fetch and patch llama.cpp
        run: tools/llama/fetch_llama.sh

      # :modelpack stages the 400MB model into the bundle, so everything downstream of it needs
      # the weights. The unit tests do not.
      - name: Cache model
        id: model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('tools/fetch_model.sh') }}

      - name: Fetch model
        if: steps.model.outputs.cache-hit != 'true'
        continue-on-error: true
        run: tools/fetch_model.sh

      - name: Check whether the model is available
        id: weights
        run: |
          if [ -f "$MODEL_PATH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No model weights::$MODEL_PATH could not be fetched, so"\
                 "lintRelease, bundleRelease, check_manifest.sh and the alignment check are"\
                 "skipped. Unit tests still ran."
          fi

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint (release)
        if: steps.weights.outputs.present == 'true'
        working-directory: android
        run: ./gradlew :app:lintRelease --console=plain

      # Unsigned: the upload key is never in CI (leaves/architecture/release-and-signing.md).
      # tools/release_check.sh is the signed-release gate and is deliberately not run here.
      - name: Release bundle
        if: steps.weights.outputs.present == 'true'
        working-directory: android
        run: ./gradlew :app:bundleRelease --console=plain

      # spine: C3, M5 — the artifact must not be able to reach the network.
      - name: Manifest check
        if: steps.weights.outputs.present == 'true'
        run: tools/check_manifest.sh "$AAB"

      # 16 KB page-size devices (leaves/BRIEF.md: NDK r27+, mandatory).
      - name: Native library alignment
        if: steps.weights.outputs.present == 'true'
        run: tools/check_alignment.py "$AAB"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/test-results/**/*.xml
          if-no-files-found: ignore
      # The AAB itself is ~400MB and is not uploaded: it is reproducible from this commit, and the
      # artifact that matters is the signed one a human builds for Play.
